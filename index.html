<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <form id="taskForm">
            <h1>Lista de tarefas</h1>
            <input type="text" placeholder="Digite sua tarefa" name="taskInput" id="taskInput">

            <span class="error" id="taskError" role="alert">
                <img src="/assets/icon/triangle-alert.svg" class="alert-icon" alt="Alerta">
                <span id="errorText"></span>
            </span>
            
            <div class="list-wrapper">
                <ul class="task-list" id="taskList"></ul>
            </div>
        </form>

        <dialog id="confirmationModal">
            <img src="/assets/icon/circle-alert.svg" alt="Alerta">
            <p class="modal-text" id="modalText"></p>
            <div>
                <button id="confirmBtn">Confirmar</button>
                <button id="cancelBtn">Cancelar</button>
            </div>
        </dialog>
    </div>
    <script src="/js/script.js"></script>
</body>

</html>
